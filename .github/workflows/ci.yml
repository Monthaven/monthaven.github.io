name: site-ci

on:
  push:
    branches-ignore: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify links, assets, canonicals and frozen URLs
        run: node scripts/check-links.mjs

      - name: Verify content depth and uniqueness
        run: node scripts/check-content.mjs
